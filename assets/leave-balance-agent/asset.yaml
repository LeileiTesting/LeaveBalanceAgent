apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: leave-balance-agent
  description: Conversational HR self-service agent that answers employee questions about remaining vacation and leave balances from SAP SuccessFactors

provides:
  apis:
    - name: leave-balance-agent
      kind: a2a
      ordId: customer.build:apiResource:leave-balance-d4f5b.leave-balance-agent:v1

container:
  buildPath: .
  port: 5000

requires:
  - name: sap-sf-ectimeoff-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:leave-balance-d4f5b.sap-sf-ectimeoff-mcp-server:v1
  - name: sap-sf-balances-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:leave-balance-d4f5b.sap-sf-balances-mcp-server:v1
  - name: sap-sf-availabletimetypes-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:leave-balance-d4f5b.sap-sf-availabletimetypes-mcp-server:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
