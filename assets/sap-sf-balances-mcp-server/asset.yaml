apiVersion: asset.sap/v1
kind: Asset
type: mcp-server

metadata:
  name: sap-sf-balances-mcp-server
  description: Exposes SAP SuccessFactors Time Off Balances REST API as MCP tools to retrieve employee leave account balances
  version: "1.0.0"
  translation: mcp-translation/translation.json
  apiSpec: mcp-translation/api-spec.json

provides:
  apis:
    - name: sap-sf-balances-mcp-server
      kind: mcp-server
      ordId: customer.build:apiResource:leave-balance-d4f5b.sap-sf-balances-mcp-server:v1

requires:
  - name: Balances
    kind: api
    ordId: sap.sf:apiResource:Balances:v1
